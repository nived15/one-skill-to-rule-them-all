name: Validate Copilot observer

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: observer-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install observer dependency
        run: python -m pip install -r .github/skills/task-observer/requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Validate native layout and observations
        run: python .github/skills/task-observer/scripts/validate-copilot-observer.py --workspace .
